replicaCount: 2

image:
  repository: redops/api
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8000"
  prometheus.io/path: "/metrics"

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: api.redops.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: redops-api-tls
      hosts:
        - api.redops.example.com

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

livenessProbe:
  httpGet:
    path: /api/v1/health
    port: 8000
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /api/v1/ready
    port: 8000
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

nodeSelector: {}

tolerations: []

affinity: {}

env:
  APP_ENV: "production"
  APP_DEBUG: "false"
  APP_LOG_LEVEL: "INFO"

# Non-secret environment delivered via a ConfigMap (rendered into a
# configmap.yaml resource and injected with envFrom). DB_HOST and
# REDIS_HOST are supplied via the secrets secret (db-host / redis-host).
config:
  DB_PORT: "5432"
  DB_USER: "redops"
  DB_NAME: "redops"
  REDIS_PORT: "6379"
  TEMPORAL_HOST: "temporal-frontend.redops.svc.cluster.local"
  TEMPORAL_PORT: "7233"
  TEMPORAL_NAMESPACE: "default"
  TEMPORAL_TASK_QUEUE: "redops-eval"
  SERVER_CORS_ORIGINS: "http://localhost:5173,http://localhost:3000"

secrets:
  dbHost: "postgres.redops.svc.cluster.local"
  dbPassword: "CHANGE_ME"
  redisHost: "redis.redops.svc.cluster.local"
  appSecretKey: "CHANGE_ME"
