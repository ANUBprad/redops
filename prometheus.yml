global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "redops-api"
    static_configs:
      - targets: ["redops-api:8000"]
    metrics_path: "/metrics"
    scrape_interval: 10s

  - job_name: "redis"
    static_configs:
      - targets: ["redis:6379"]

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: "temporal"
    static_configs:
      - targets: ["temporal:8233"]

alerting:
  alertmanagers:
    - static_configs:
        - targets: []
