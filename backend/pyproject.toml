[project]
name = "redops-eval"
version = "0.1.0"
description = "Production-grade LLM Evaluation & Red Teaming Platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "temporalio>=1.7",
    "structlog>=24.0",
    "redis>=5.0",
    "httpx>=0.27",
    "pyjwt>=2.8",
    "cryptography>=42.0",
    "uvicorn[standard]>=0.30",
]

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",    # 1 blank line required before class docstring
    "D213",    # Multi-line docstring summary should start at second line
    "D401",    # First line should be in imperative mood
    "ANN101",  # Missing type annotation for self
    "ANN102",  # Missing type annotation for cls
    "S311",    # Standard pseudo-random generators
    "EM101",   # Exception must not use string literal
    "EM102",   # Exception must not use f-string
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "D104"]
"tests/*" = ["D", "ANN", "S101", "SLF001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
strict = true
python_version = "3.12"
show_error_codes = true
warn_unused_ignores = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "temporalio.*",
    "sqlalchemy.*",
    "alembic.*",
    "asyncpg.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
