[project]
name = "redops-eval"
version = "0.1.0"
description = "Production-grade LLM Evaluation & Red Teaming Platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pydantic[email]>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "temporalio>=1.7",
    "structlog>=24.0",
    "redis>=5.0",
    "httpx>=0.27",
    "pyjwt>=2.8",
    "cryptography>=42.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
    "openai>=1.0",
    "anthropic>=0.20",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "prometheus-client>=0.20",
]

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.format]
exclude = ["*.md"]

quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "W",      # pycodestyle warnings
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "RUF",    # ruff-specific rules
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PERF",   # perflint
    "C4",     # flake8-comprehensions
    "S",      # flake8-bandit (security)
    "BLE",    # blind-except
    "PT",     # flake8-pytest-style
]
ignore = [
    "UP046",   # non-pep695-generic-class
    "UP047",   # non-pep695-generic-function
    "UP042",   # replace-str-enum
    "E501",    # line-too-long (handled by line-length)
    "B008",    # fastapi-depends-default (standard FastAPI DI pattern)
    "B024",    # abstract-base-class-without-abstract-method
    "BLE001",  # blind-except (used in broad exception handlers)
    "SIM105",  # suppressible-exception
    "SIM102",  # collapsible-if
    "PERF401", # manual-list-comprehension
    "S104",    # hardcoded-bind-all-interfaces
    "S105",    # hardcoded-password-positive (false positives in tests/config)
    "S106",    # hardcoded-password-func-arg
    "S108",    # hardcoded-temp-file
    "S110",    # try-except-pass (intentional in some patterns)
    "S311",    # suspicious-non-cryptographic-random-usage
    "TC001",   # typing-only-first-party-import (defer to later)
    "TC002",   # typing-only-third-party-import (defer to later)
    "TC003",   # typing-only-standard-library-import (defer to later)
    "RUF005",  # collection-literal-concatenation (style)
    "RUF043",  # pytest-raises-ambiguous-pattern (style)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "D104"]
"tests/*" = [
    "D",       # all docstring rules
    "ANN",     # all annotation rules
    "S101",    # assert used
    "SLF001",  # private member access
    "PLR2004", # magic values
    "PLC0415", # import-outside-top-level
    "ARG",     # unused arguments
    "PT",      # pytest style
    "N",       # naming conventions
    "TRY",     # tryceratops
    "INP",     # namespace packages
    "PLR",     # pylint refactoring
    "SIM",     # simplify
    "B011",    # assert-false
    "B017",    # assert-raises-exception
    "BLE001",  # blind-except
    "FBT",     # boolean trap
    "ERA",     # commented-out code
    "PGH",     # blanket-type-ignore
]
"tests/evaluation/orchestration/conftest.py" = ["F821"]
"app/rbac/*" = ["B008"]
"app/apikeys/*" = ["B008"]
"app/scheduling/*" = ["B008"]
"app/project/*" = ["B008"]
"app/audit/*" = ["B008"]
"app/notification/*" = ["B008"]

[tool.mypy]
strict = true
python_version = "3.12"
show_error_codes = true
warn_unused_ignores = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "temporalio.*",
    "sqlalchemy.*",
    "alembic.*",
    "asyncpg.*",
    "passlib.*",
    "jwt.*",
    "pyjwt.*",
    "python_multipart.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
