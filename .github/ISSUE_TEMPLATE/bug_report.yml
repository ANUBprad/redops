name: Bug report
description: Report a bug to help improve RedOps Eval
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much as you can.

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Concrete steps to reproduce the behavior.
      placeholder: |
        1. Start the API with ...
        2. Create a project ...
        3. Run an evaluation ...
        4. See error ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen instead.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, Node version, Docker version, deployment type.
      placeholder: "e.g. macOS 14, Python 3.12, Node 20, Docker Compose (dev)"

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / stack traces
      description: Paste any relevant logs, error messages, or stack traces.
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else that may be relevant (screenshots, links, config).
