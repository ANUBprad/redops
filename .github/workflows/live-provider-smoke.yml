name: Live Provider Smoke

on:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      require_live_credentials:
        description: Fail unless all three provider secrets are configured
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  live-provider-smoke:
    name: Live OpenAI / Anthropic / Groq smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REDOPS_LIVE_PROVIDER_TESTS: "1"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      REDOPS_LIVE_OPENAI_MODEL: ${{ vars.REDOPS_LIVE_OPENAI_MODEL }}
      REDOPS_LIVE_ANTHROPIC_MODEL: ${{ vars.REDOPS_LIVE_ANTHROPIC_MODEL }}
      REDOPS_LIVE_GROQ_MODEL: ${{ vars.REDOPS_LIVE_GROQ_MODEL }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Require credentials for manual live qualification
        if: github.event_name == 'workflow_dispatch' && inputs.require_live_credentials
        shell: bash
        run: |
          missing=()
          [[ -n "$OPENAI_API_KEY" ]] || missing+=("OPENAI_API_KEY")
          [[ -n "$ANTHROPIC_API_KEY" ]] || missing+=("ANTHROPIC_API_KEY")
          [[ -n "$GROQ_API_KEY" ]] || missing+=("GROQ_API_KEY")
          if (("${#missing[@]}" > 0)); then
            printf 'Live provider qualification requires these repository secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Install backend and test dependencies
        working-directory: backend
        run: python -m pip install -e ".[dev]"

      - name: Call configured external providers
        working-directory: backend
        run: python -m pytest -q tests/providers/test_live_provider_smoke.py -ra
